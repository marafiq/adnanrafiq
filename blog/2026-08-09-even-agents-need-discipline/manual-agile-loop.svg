<svg xmlns="http://www.w3.org/2000/svg" width="730" height="856" viewBox="70 0 730 856" role="img" aria-label="AGILE run by hand, as one loop. Vision, Values and Goals set direction, and an EPIC is sliced in refinement. Refinement is a room holding Product, UX/UI, Engineering and QA/Test, whose work is checked against INVEST — valuable, independent, small — and produces four artifacts: a STORY, its ACCEPTANCE CRITERIA, a SPIKE when the terrain is unknown, and a Definition of Done agreed once for every story. That output enters the sprint. Inside the sprint sits the engineering process as a sub-workflow of its own: optional TASKS, then EXECUTION, then REVIEW, with review sending work back for changes. After it come the DONE check against the DoD, the DEMO, and the RETRO, which feeds back into the goals.">
<style>
  svg { --surface:#FFFFFF; --panel:#FAFBFA; --ink:#171C19; --muted:#5F6B64; --line:#D5DBD6;
        --accent:#8F6210; --accent-line:#C39A3E; --accent-soft:#F4EAD6;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1B211C; --panel:#202722; --ink:#E7ECE7; --muted:#98A69C; --line:#2F382F;
          --accent:#E0AE55; --accent-line:#A67F31; --accent-soft:#2A2418; }
  }
  .node   { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .node-h { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1.75; }
  .node-o { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .room   { fill: var(--panel); stroke: var(--accent-line); stroke-width: 1.75; }
  .box    { fill: var(--panel); stroke: var(--muted); stroke-width: 1.4; opacity: 0.9; }
  .box-in { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: 0.75; }
  .div    { stroke: var(--accent-line); stroke-width: 1; opacity: 0.5; }
  .lbl    { font-family: var(--mono); font-size: 14.5px; font-weight: 600; fill: var(--ink); }
  .lbl-a  { font-family: var(--mono); font-size: 14.5px; font-weight: 600; fill: var(--accent); }
  .lbl-m  { font-family: var(--mono); font-size: 14.5px; font-weight: 600; fill: var(--muted); }
  .sub    { font-family: var(--mono); font-size: 11.5px; fill: var(--muted); }
  .edge      { stroke: var(--ink); stroke-width: 1.4; fill: none; opacity: 0.75; }
  .edge-back { stroke: var(--muted); stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; }
  .edge-lbl  { font-family: var(--mono); font-size: 11.5px; fill: var(--muted); }
  .ahead     { fill: var(--ink); opacity: 0.75; }
  .ahead-b   { fill: var(--muted); opacity: 0.65; }
</style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ahead" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ahead-b" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>

  <text class="lbl-a" x="112" y="32">AGILE, RUN BY HAND</text>
  <text class="sub" x="292" y="32">one value stream — expand or collapse it for yours</text>

  <!-- direction -->
  <rect class="node" x="128" y="52" width="143" height="74" rx="3"/>
  <text class="lbl" x="141" y="78">VISION</text><text class="sub" x="141" y="96">why we exist</text><text class="sub" x="141" y="112">rarely changes</text>
  <rect class="node" x="287" y="52" width="143" height="74" rx="3"/>
  <text class="lbl" x="300" y="78">VALUES</text><text class="sub" x="300" y="96">how we choose</text><text class="sub" x="300" y="112">when we disagree</text>
  <rect class="node" x="446" y="52" width="143" height="74" rx="3"/>
  <text class="lbl" x="459" y="78">GOALS</text><text class="sub" x="459" y="96">what, by when</text><text class="sub" x="459" y="112">this quarter</text>
  <rect class="node" x="605" y="52" width="143" height="74" rx="3"/>
  <text class="lbl" x="618" y="78">EPIC</text><text class="sub" x="618" y="96">one larger value</text><text class="sub" x="618" y="112">many stories</text>
  <line class="edge" x1="271" y1="89" x2="283" y2="89" marker-end="url(#ar)"/>
  <line class="edge" x1="430" y1="89" x2="442" y2="89" marker-end="url(#ar)"/>
  <line class="edge" x1="589" y1="89" x2="601" y2="89" marker-end="url(#ar)"/>
  <line class="edge" x1="676" y1="126" x2="676" y2="180" marker-end="url(#ar)"/>
  <text class="edge-lbl" x="664" y="152" text-anchor="end">sliced in the room</text>

  <!-- refinement -->
  <rect class="room" x="112" y="184" width="652" height="272" rx="3"/>
  <line class="div" x1="112" y1="218" x2="764" y2="218"/>
  <text class="lbl-a" x="128" y="208">REFINEMENT</text>
  <text class="sub" x="224" y="208">the whole team in one room, before anything is built</text>

  <rect class="node-h" x="128" y="226" width="143" height="72" rx="3"/>
  <text class="lbl-a" x="141" y="252">PRODUCT</text><text class="sub" x="141" y="270">is it valuable</text><text class="sub" x="141" y="286">and to whom</text>
  <rect class="node-h" x="287" y="226" width="143" height="72" rx="3"/>
  <text class="lbl-a" x="300" y="252">UX / UI</text><text class="sub" x="300" y="270">how it feels</text><text class="sub" x="300" y="286">states and edges</text>
  <rect class="node-h" x="446" y="226" width="143" height="72" rx="3"/>
  <text class="lbl-a" x="459" y="252">ENGINEERING</text><text class="sub" x="459" y="270">what it costs</text><text class="sub" x="459" y="286">what it breaks</text>
  <rect class="node-h" x="605" y="226" width="143" height="72" rx="3"/>
  <text class="lbl-a" x="618" y="252">QA / TEST</text><text class="sub" x="618" y="270">how we know</text><text class="sub" x="618" y="286">that it works</text>

  <text class="edge-lbl" x="420" y="322" text-anchor="end">checked against INVEST</text>
  <text class="edge-lbl" x="420" y="338" text-anchor="end">valuable · independent · small</text>
  <line class="edge" x1="438" y1="306" x2="438" y2="348" marker-end="url(#ar)"/>
  <text class="edge-lbl" x="456" y="322">one conversation,</text>
  <text class="edge-lbl" x="456" y="338">four sets of concerns</text>

  <rect class="node" x="128" y="356" width="143" height="84" rx="3"/>
  <text class="lbl" x="141" y="382">STORY</text><text class="sub" x="141" y="402">a slice of value</text><text class="sub" x="141" y="418">small, on its own</text>
  <rect class="node" x="287" y="356" width="143" height="84" rx="3"/>
  <text class="lbl" x="300" y="382">ACCEPTANCE</text><text class="lbl" x="300" y="399">CRITERIA</text><text class="sub" x="300" y="421">agreed, checkable</text>
  <rect class="node" x="446" y="356" width="143" height="84" rx="3"/>
  <text class="lbl" x="459" y="382">SPIKE</text><text class="sub" x="459" y="402">terrain unknown</text><text class="sub" x="459" y="418">changes stories</text>
  <rect class="node" x="605" y="356" width="143" height="84" rx="3"/>
  <text class="lbl" x="618" y="382">DoD</text><text class="sub" x="618" y="402">agreed once</text><text class="sub" x="618" y="418">every story</text>
  <line class="edge" x1="271" y1="392" x2="283" y2="392" marker-end="url(#ar)"/>

  <!-- into the sprint -->
  <line class="edge" x1="234" y1="456" x2="234" y2="536" marker-end="url(#ar)"/>
  <text class="edge-lbl" x="250" y="482">criteria in hand</text>

  <rect class="box" x="112" y="496" width="652" height="320" rx="3"/>
  <text class="lbl-m" x="280" y="520">THE SPRINT</text>
  <text class="sub" x="376" y="520">a timebox · standup (a discipline lever)</text>

  <!-- engineering process: a sub-workflow of its own -->
  <rect class="box-in" x="128" y="540" width="620" height="160" rx="3"/>
  <text class="lbl-m" x="144" y="562">ENGINEERING PROCESS</text>
  <text class="sub" x="316" y="562">a sub-workflow of its own</text>

  <rect class="node-o" x="144" y="578" width="180" height="76" rx="3"/>
  <text class="lbl" x="158" y="604">TASKS</text><text class="sub" x="158" y="622">optional</text><text class="sub" x="158" y="638">how, not what</text>
  <rect class="node-h" x="348" y="578" width="180" height="76" rx="3"/>
  <text class="lbl-a" x="362" y="604">EXECUTION</text><text class="sub" x="362" y="622">a person types it</text><text class="sub" x="362" y="638">hours, not tokens</text>
  <rect class="node-h" x="552" y="578" width="180" height="76" rx="3"/>
  <text class="lbl-a" x="566" y="604">REVIEW</text><text class="sub" x="566" y="622">a peer reads it</text><text class="sub" x="566" y="638">and asks why</text>
  <line class="edge" x1="328" y1="616" x2="344" y2="616" marker-end="url(#ar)"/>
  <line class="edge" x1="532" y1="616" x2="548" y2="616" marker-end="url(#ar)"/>
  <path class="edge-back" d="M 642 654 L 642 674 L 438 674 L 438 658" marker-end="url(#arb)"/>
  <text class="edge-lbl" x="540" y="690" text-anchor="middle">back for changes</text>

  <line class="edge" x1="642" y1="700" x2="642" y2="720" marker-end="url(#ar)"/>

  <rect class="node-h" x="552" y="724" width="180" height="76" rx="3"/>
  <text class="lbl-a" x="566" y="750">DONE?</text><text class="sub" x="566" y="768">against the DoD</text><text class="sub" x="566" y="784">not against effort</text>
  <rect class="node-h" x="348" y="724" width="180" height="76" rx="3"/>
  <text class="lbl-a" x="362" y="750">DEMO</text><text class="sub" x="362" y="768">stakeholder judges</text><text class="sub" x="362" y="784">what changed</text>
  <rect class="node-h" x="144" y="724" width="180" height="76" rx="3"/>
  <text class="lbl-a" x="158" y="750">RETRO</text><text class="sub" x="158" y="768">what we change</text><text class="sub" x="158" y="784">and how we argue</text>
  <line class="edge" x1="548" y1="762" x2="532" y2="762" marker-end="url(#ar)"/>
  <line class="edge" x1="344" y1="762" x2="328" y2="762" marker-end="url(#ar)"/>

  <!-- the DoD is one list, applied downstream -->
  <path class="edge-back" d="M 748 398 L 782 398 L 782 762 L 736 762" marker-end="url(#arb)"/>
  <text class="edge-lbl" x="778" y="482" text-anchor="end">the same list, every story</text>

  <!-- the loop closes -->
  <path class="edge" d="M 144 762 L 88 762 L 88 160 L 517 160 L 517 130" marker-end="url(#ar)"/>
  <text class="edge-lbl" x="100" y="148">what we learned changes what we aim at next</text>

  <!-- legend -->
  <rect class="node-h" x="112" y="828" width="18" height="12" rx="2"/>
  <text class="sub" x="136" y="838">a person, or a room of them</text>
  <rect class="node" x="338" y="828" width="18" height="12" rx="2"/>
  <text class="sub" x="362" y="838">an artifact</text>
  <rect class="node-o" x="454" y="828" width="18" height="12" rx="2"/>
  <text class="sub" x="478" y="838">optional</text>
</svg>
